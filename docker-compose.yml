# kafka-lab 기본 환경 — 3-broker KRaft 클러스터
#
# "소꿉장난(단일 브로커)"이 아니라 운영 관점의 멀티브로커를 기본 전제로 한다.
# 복제(ISR)·리더 선출·leader epoch·KRaft 합의는 멀티브로커에서만 증명된다.
#
# 각 노드는 broker + controller 겸임(KRaft Combined). controller quorum = 3노드.
# 호스트 접속(bootstrap): localhost:9092,localhost:9093,localhost:9094
#   (한 개만 알려줘도 메타데이터로 나머지를 발견한다 → 기존 테스트의 localhost:9092 호환)
#
# 단일 브로커가 필요하면: docker-compose -f docker-compose.single-broker.yml up -d

x-kafka-common: &kafka-common
  image: apache/kafka:3.7.0
  environment: &kafka-common-env
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9091,2@kafka2:9091,3@kafka3:9091
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
    # 운영 기본값 (멀티브로커 전제)
    KAFKA_NUM_PARTITIONS: 3
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    KAFKA_LOG_RETENTION_HOURS: 1
    KAFKA_LOG_SEGMENT_BYTES: 104857600
    CLUSTER_ID: "kafka-lab-cluster-id-01"

services:
  kafka1:
    <<: *kafka-common
    hostname: kafka1
    container_name: kafka1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: CONTROLLER://:9091,INTERNAL://:9090,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9090,HOST://localhost:9092

  kafka2:
    <<: *kafka-common
    hostname: kafka2
    container_name: kafka2
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: CONTROLLER://:9091,INTERNAL://:9090,HOST://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9090,HOST://localhost:9093

  kafka3:
    <<: *kafka-common
    hostname: kafka3
    container_name: kafka3
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: CONTROLLER://:9091,INTERNAL://:9090,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9090,HOST://localhost:9094

# Kafka Connect(Step 8)는 멀티브로커 버전에서 별도 추가 예정.
# 기존 Connect 설정은 docker-compose.single-broker.yml 참고.
